name: Web visualization contract

on:
  pull_request:
    paths:
      - "platform/apps/web/**"
      - "platform/contracts/visualization/**"
      - "platform/contracts/ask-fedpulse/**"
      - ".github/workflows/web-visualization-contract.yml"
  push:
    branches:
      - master
    paths:
      - "platform/apps/web/**"
      - "platform/contracts/visualization/**"
      - "platform/contracts/ask-fedpulse/**"
      - ".github/workflows/web-visualization-contract.yml"

permissions:
  contents: read

jobs:
  validate-web-visualizations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate embeddable analytics
        run: npm run validate:visualizations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build
