name: Web visualization contract

on:
  pull_request:
    paths:
      - "platform/apps/web/**"
      - "platform/contracts/visualization/**"
      - ".github/workflows/web-visualization-contract.yml"
  push:
    branches:
      - master
    paths:
      - "platform/apps/web/**"
      - "platform/contracts/visualization/**"
      - ".github/workflows/web-visualization-contract.yml"

permissions:
  contents: write

jobs:
  validate-web-visualizations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/web

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/apps/web/package-lock.json

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Validate embeddable analytics
        run: npm run validate:visualizations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Commit synchronized package lock
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git diff --quiet -- platform/apps/web/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/web/package-lock.json
          git commit -m "Synchronize web dependency lock"
          git push origin HEAD:${{ github.head_ref }}
