name: API foundation

on:
  pull_request:
    paths:
      - "platform/apps/api/**"
      - "platform/contracts/visualization/**"
      - "platform/contracts/ask-fedpulse/**"
      - "platform/supabase/**"
      - "platform/config/products/**"
      - ".github/workflows/api-foundation.yml"
  push:
    branches:
      - master
    paths:
      - "platform/apps/api/**"
      - "platform/contracts/visualization/**"
      - "platform/contracts/ask-fedpulse/**"
      - "platform/supabase/**"
      - "platform/config/products/**"
      - ".github/workflows/api-foundation.yml"

jobs:
  validate-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/apps/api/requirements.txt
            platform/apps/api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall .

      - name: Lint maintained API surface
        run: |
          ruff check \
            config.py \
            main.py \
            models/ask_fedpulse.py \
            models/schemas.py \
            models/visualizations.py \
            routers/ask_fedpulse.py \
            routers/health.py \
            routers/renewals.py \
            services/ask_fedpulse.py \
            services/auth.py \
            services/data_service.py \
            scripts \
            tests \
            --select E,F \
            --ignore E501

      - name: Test
        env:
          ENVIRONMENT: test
          ALLOW_DEV_AUTH: "false"
          DATA_BACKEND: csv
          PYTHONPATH: .
        run: python -m pytest -q
